packages:
  - web
  - backend
# tldraw 5.2.x packages use sibling @tldraw imports that strict bundlers resolve
# from the virtual store root.
hoistPattern:
  - "@tldraw/*"
allowBuilds:
  "@google/genai": true
  esbuild: true
  koffi: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@0.79.6"
  - "@earendil-works/pi-ai@0.79.6"
  - "@earendil-works/pi-coding-agent@0.79.6"
  - "@earendil-works/pi-tui@0.79.6"
