packages:
  - web
  - backend
# tldraw 5.2.x imports @tldraw/state without declaring it as a dependency;
# hoist it into .pnpm/node_modules so the import resolves.
hoistPattern:
  - "@tldraw/state"
allowBuilds:
  "@google/genai": true
  esbuild: true
  koffi: true
  protobufjs: true
minimumReleaseAgeExclude:
  - "@earendil-works/pi-agent-core@0.79.6"
  - "@earendil-works/pi-ai@0.79.6"
  - "@earendil-works/pi-coding-agent@0.79.6"
  - "@earendil-works/pi-tui@0.79.6"
